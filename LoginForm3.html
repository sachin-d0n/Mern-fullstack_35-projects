<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0px;
        }
.second{
    width:100vw;
    height:100vh;
    background-color: rgb(42, 0, 81);
  position:relative;
}
.s1{
    display:flex;
    flex-direction: column;
    width:35vw;
    height:50vh;
    background-color: aliceblue;
    position:absolute;
    top:25vh;
    left:30vw;
    align-items: center;
    border-radius: 10px;
}
h2{
    color: black;
    font-size: 30px;
    font-weight: bold;
}
.s1 input{
    margin-top: 20px;
    /* font-size: large; */
    padding:10px;
    border-radius:10px;
    border:1px solid grey;
    width:300px;
    font-size:20px;
    
}
button{
    background-color: #2A0051;
    color:white;
    font-weight: bold;
    font-size: large;
    margin-top: 30px;
    padding:8px;
    border-radius: 5px;
    width:100px;
}
::placeholder{
    text-align: center;
    font-size: x-large;
}
    </style>
</head>
<body>
    <div class="second">
        <div class="s1">
            <h2>Signin here</h2>
            <input type="text" placeholder="Enter text">
            <input type="email" placeholder="Enter email">
            <input type="number" placeholder="Enter number">
            <button type="submit">submit</button>      
       
        </div>
    </div>
</body>
</html>
